version: "3.8"

services:
  backend:
    build: .
    container_name: xinan-dawang-backend
    ports:
      - "8000:8000"
    volumes:
      # 数据库文件持久化（容器删除后数据不丢失）
      - ./data:/app/data
      # 上传的真题文件持久化
      - ./uploads:/app/uploads
    environment:
      - TZ=Asia/Shanghai
      # 从 .env 文件读取（也支持直接在下面配置）
      - DATABASE_URL=sqlite+aiosqlite:////app/data/xinan_dawang.db
    env_file:
      - .env
    restart: unless-stopped

  # 可选：Nginx 反向代理（如需 HTTPS 或自定义域名）
  # nginx:
